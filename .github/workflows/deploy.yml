name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Prepare deployment
        run: |
          # Create temporary directory for deployment
          mkdir -p temp_deploy
          
          # Copy the HTML file
          cp COURSE_PRACTICE_QUESTIONS/Testing/index_skulpt.html temp_deploy/
          
          # Copy Skulpt files maintaining relative paths
          mkdir -p temp_deploy/skulpt-dist-master
          cp -r skulpt-dist-master/* temp_deploy/skulpt-dist-master/
          
          # Create .nojekyll file
          touch temp_deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./temp_deploy
          publish_branch: gh-pages
          force_orphan: true